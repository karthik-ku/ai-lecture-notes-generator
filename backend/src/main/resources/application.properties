spring.application.name=ai-lecture-notes-generator
server.port=${PORT:8080}

# Database configuration (Default to H2 for local development, easily switch to PostgreSQL via env)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:ailecturedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (for debugging local data if needed)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart / File upload configuration (10 MB max)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# AI Service Configuration
ai.api.key=${AI_API_KEY:}
ai.base.url=${AI_BASE_URL:https://api.openai.com/v1}
ai.model=${AI_MODEL:gpt-4o-mini}

# Frontend CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,https://*.vercel.app}

# JWT / Token Secret Key
app.jwt.secret=${JWT_SECRET:AI_LECTURE_NOTES_SECURE_TOKEN_SECRET_KEY_FOR_LOCAL_DEV_2026_XYZ}
