services:
  postgres:
    image: postgres:16-alpine
    container_name: ailecture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ailecturedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ailecturedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ailecture-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/ailecturedb
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgrespassword
      FRONTEND_URL: http://localhost:3000,http://localhost:5173
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      PORT: 8080

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ailecture-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
