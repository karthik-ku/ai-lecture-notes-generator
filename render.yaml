services:
  - type: web
    name: ai-lecture-notes-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-lecture-notes-db
          property: connectionString
      - key: FRONTEND_URL
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: AI_API_KEY
        sync: false

databases:
  - name: ai-lecture-notes-db
    plan: free
    databaseName: ailecturedb
    user: ailectureuser
